<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LGSale｜請使用電腦版</title>
<style>
:root{--blue:#1769aa;--ink:#172b3a;--muted:#667085;--line:#d9e1e8;--bg:#f5f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Noto Sans TC",sans-serif}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 50px #17324d17}.brand{font-size:24px;font-weight:750}.icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:28px auto 18px;background:#fff2cc;color:#8a6100;font-size:30px;font-weight:800}h1{text-align:center;font-size:26px;margin:0 0 10px}p{color:var(--muted)}.notice{padding:14px;background:#f5f7fa;border-radius:10px}.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:700;margin-top:18px}.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}
</style></head><body><main class="card"><div class="brand">LGSale</div><div class="icon">i</div><h1>請使用電腦版</h1>
<p id="message">你的帳號已成功登入，但目前僅開放 LGSale 桌機功能。</p>
<div class="notice">手機上不提供任務、巡店或 PSI 資料。<br><br>請在電腦開啟員工登入頁，點選「使用 iPhone 掃碼授權桌機」，再用這支手機掃描 QR Code 並確認。</div>
<button class="btn" id="copy">複製電腦登入網址</button><button class="btn secondary" id="logout">登出</button></main>
<script>
fetch('/api/auth/me').then(r=>r.json()).then(me=>{if(me.name)document.querySelector('#message').textContent=me.name+'，你的帳號已成功登入，但目前僅開放 LGSale 桌機功能。'}).catch(()=>{});
document.querySelector('#copy').onclick=async()=>{const url=new URL('/login/employee',location.origin).href;try{await navigator.clipboard.writeText(url);document.querySelector('#copy').textContent='已複製登入網址'}catch{prompt('請複製電腦登入網址',url)}};
document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login/employee'};
</script></body></html>
