<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGSale｜手機任務照片</title>
  <style>
    :root{--blue:#1769aa;--nav:#17324d;--bg:#eef2f6;--ink:#172b3a;--muted:#667085;--line:#d9e1e8;--ok:#087a55;--warn:#b54708;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI","Noto Sans TC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:#f8fafc;box-shadow:0 0 40px #1b355233;padding-bottom:76px;position:relative}.statusbar{height:26px;background:var(--nav);color:#dce8f1;font-size:11px;padding:6px 16px;display:flex;justify-content:space-between}.head{height:58px;background:var(--nav);color:white;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.head b{font-size:18px}.head a{color:#d8ecfa;text-decoration:none;font-size:12px}.content{padding:18px}.tabs{display:flex;background:#edf2f6;border-radius:9px;padding:4px;margin-bottom:16px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:7px;color:var(--muted)}.tabs button.active{background:white;color:var(--blue);font-weight:700;box-shadow:0 1px 4px #0002}.task{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left;margin-bottom:10px;color:var(--ink)}.task .top{display:flex;justify-content:space-between;gap:10px}.task small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f2fb;color:var(--blue);font-size:11px;font-weight:700}.pill.warn{background:#fff4e5;color:var(--warn)}.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:14px}.hero{background:linear-gradient(135deg,#17324d,#1769aa);color:white;padding:20px;border-radius:14px}.hero h1{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#d9eaf7}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;margin:13px 0}.card h2{font-size:16px;margin:0 0 10px}.shot{background:white;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}.shot-head{padding:13px;display:flex;justify-content:space-between}.square{aspect-ratio:1;background:linear-gradient(145deg,#d7e0e7,#9fb3c3);display:grid;place-items:center;color:#fff;text-align:center;position:relative;overflow:hidden}.square:before,.square:after{content:"";position:absolute;border:1px solid #ffffff99}.square:before{inset:15%}.square:after{inset:33%}.square span{position:relative;z-index:1;text-shadow:0 1px 4px #0007}.shot-actions{display:flex;gap:8px;padding:12px}.btn{width:100%;border:1px solid var(--blue);background:white;color:var(--blue);font-weight:700;border-radius:10px;padding:12px}.btn.primary{background:var(--blue);color:white}.btn.warn{border-color:#d99924;color:#965a00;background:#fff9eb}.btn:disabled{opacity:.45}.upload{font-size:12px;color:var(--muted)}.upload.ok{color:var(--ok)}.progress{height:6px;background:#e6ebef;border-radius:9px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);transition:.25s}.input{width:100%;padding:11px;border:1px solid #aebdca;border-radius:9px;margin-top:7px}.notice{background:#fff8e8;border:1px solid #f3d58b;color:#694a00;padding:12px;border-radius:9px}.success{text-align:center;padding:70px 25px}.check{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#e8f8ef;color:var(--ok);font-size:38px;margin:0 auto 20px}.bottom{position:absolute;bottom:0;left:0;right:0;height:68px;border-top:1px solid var(--line);background:white;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:white;color:var(--muted);font-size:11px}.bottom button.active{color:var(--blue);font-weight:700}.bottom b{display:block;font-size:20px}[hidden]{display:none!important}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);background:#172b3a;color:white;padding:10px 15px;border-radius:8px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>●●●　100%</span></div>
  <header class="head"><b>公司任務</b><a href="/mobile">巡店介面</a></header>
  <main class="content">
    <section id="list"><div class="tabs"><button class="active">待完成</button><button>已完成</button><button>全部</button></div><div id="taskList"></div></section>
    <section id="detail" hidden><button class="back" data-go="list">‹ 任務清單</button><div class="hero"><h1 id="taskTitle">新機上市布置</h1><p id="taskDealer">台北大同電器</p></div><div class="card"><h2>任務內容</h2><p>請依核准樣本逐項完成拍攝。所有照片使用 1:1，正式輸出 1200 × 1200。</p><p><b>期限：</b><span id="taskDue"></span></p></div><div class="card"><h2>拍照項目</h2><div id="requirements"></div></div><button class="btn primary" id="start">開始執行任務</button><p><button class="btn warn" id="noPhoto">不拍照完成</button></p></section>
    <section id="capture" hidden><button class="back" data-go="detail">‹ 任務內容</button><h1 id="captureTitle">拍攝任務照片</h1><div id="shots"></div><button class="btn" id="addPhoto">＋ 新增圖片</button><p><button class="btn primary" id="complete" disabled>照片上傳中</button></p></section>
    <section id="reason" hidden><button class="back" data-go="detail">‹ 返回任務</button><h1>不拍照完成</h1><div class="notice">你選定不拍照完成，請說明無法執行這個拍照任務的原因。</div><label><b>無法執行原因 *</b><textarea class="input" id="note" rows="5" placeholder="例如：經銷商目前沒有新機可以布置。"></textarea></label><p><button class="btn warn" id="confirmNoPhoto">確認不拍照完成</button></p></section>
    <section id="success" hidden><div class="success"><div class="check">✓</div><h1>任務已完成</h1><p id="result">照片已正式送出</p><button class="btn primary" data-go="list">返回任務清單</button></div></section>
  </main>
  <nav class="bottom"><button onclick="location.href='/mobile'"><b>⌂</b>首頁</button><button onclick="location.href='/mobile'"><b>▣</b>經銷商</button><button class="active" data-go="list"><b>✓</b>任務</button><button><b>●</b>我的</button></nav>
</div>
<div class="toast" id="toast"></div>
<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let tasks=[],current=null,items=[];
  const toast=t=>{const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2200)};
  function show(id){$$('main section').forEach(s=>s.hidden=s.id!==id);$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
  function renderTasks(){const visible=tasks.filter(t=>!t.completed);$('#taskList').innerHTML=visible.length?visible.map(t=>'<button class="task" data-id="'+t.executionId+'"><div class="top"><b>'+t.title+'</b><span class="pill '+(t.sample.length?'':'warn')+'">'+(t.sample.length?'核准樣本 '+t.sample.length+' 項':'無樣本模式')+'</span></div><small>'+t.dealer+'｜期限：'+t.dueDate+'</small></button>').join(''):'<div class="card" style="text-align:center;color:var(--muted)">目前沒有待完成任務</div>';$$('.task').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.id)))}
  function openTask(id){current=tasks.find(t=>t.executionId===id);$('#taskTitle').textContent=current.title;$('#taskDealer').textContent=current.dealer;$('#taskDue').textContent=current.dueDate;$('#requirements').innerHTML=(current.sample.length?current.sample:['自行新增照片並填寫說明']).map((x,i)=>'<p><span class="pill">'+(i+1)+'</span>　'+x+'</p>').join('');show('detail')}
  function buildShots(){items=(current.sample.length?current.sample:['現場完成照片']).map((x,i)=>({description:x,progress:0,uploaded:false,index:i}));renderShots();items.forEach((x,i)=>simulate(i))}
  function renderShots(){$('#shots').innerHTML=items.map((x,i)=>'<article class="shot"><div class="shot-head"><b>'+(i+1)+'　'+x.description+'</b><span class="upload '+(x.uploaded?'ok':'')+'">'+(x.uploaded?'✓ 已上傳':'上傳中 '+x.progress+'%')+'</span></div><div class="square"><span>1 : 1 自動裁切預覽<br>1200 × 1200</span></div><div class="shot-actions"><button class="btn" onclick="retake('+i+')">重拍</button><button class="btn" onclick="renamePhoto('+i+')">修改說明</button></div><div class="progress"><i style="width:'+x.progress+'%"></i></div></article>').join('');const done=items.length&&items.every(x=>x.uploaded);$('#complete').disabled=!done;$('#complete').textContent=done?'完成任務':'照片上傳中'}
  function simulate(i){const timer=setInterval(()=>{items[i].progress=Math.min(100,items[i].progress+17);if(items[i].progress===100){items[i].uploaded=true;clearInterval(timer);fetch('/api/task-executions/'+current.executionId+'/photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:items[i].description})})}renderShots()},280)}
  function retake(i){items[i].progress=0;items[i].uploaded=false;renderShots();simulate(i);toast('已重新拍攝並開始上傳')}
  function renamePhoto(i){const text=prompt('照片說明',items[i].description);if(text&&text.trim()){items[i].description=text.trim();renderShots()}}
  $('#start').onclick=()=>{buildShots();$('#addPhoto').disabled=current.sample.length>0;$('#captureTitle').textContent=current.title+'（'+items.length+' 項）';show('capture')};
  $('#noPhoto').onclick=()=>show('reason');
  $('#addPhoto').onclick=()=>{items.push({description:'新增任務照片',progress:0,uploaded:false,index:items.length});renderShots();simulate(items.length-1)};
  $('#complete').onclick=async()=>{const r=await fetch('/api/task-executions/'+current.executionId+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photoCount:items.length})});const out=await r.json();if(!r.ok)return toast(out.error);$('#result').textContent='照片 '+items.length+' 張｜完成時間 '+out.submittedAt.replace('T',' ');show('success');renderTasks()};
  $('#confirmNoPhoto').onclick=async()=>{const note=$('#note').value.trim();const r=await fetch('/api/task-executions/'+current.executionId+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photoCount:0,executionNote:note})});const out=await r.json();if(!r.ok)return toast(out.error);$('#result').textContent='照片 0 張｜原因已送出';show('success');renderTasks()};
  $$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('目前顯示「'+b.textContent+'」')});
  fetch('/api/photo-tasks').then(r=>r.json()).then(x=>{tasks=x;renderTasks()}).catch(()=>$('#taskList').innerHTML='<div class="card">請先執行 python LGSale.py。</div>');
  $$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
</script>
</body>
</html>
