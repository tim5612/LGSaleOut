<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LGSale｜公司任務</title>
<style>
:root{--blue:#dae8fc;--bl:#6c8ebf;--yellow:#fff2cc;--yl:#d6b656;--green:#d5e8d4;--line:#ccc;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#222;font:14px/1.45 "Segoe UI","Noto Sans TC",sans-serif}button,input,textarea{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;padding-bottom:70px}.status{height:24px;padding:4px 18px;font-size:11px;display:flex;justify-content:space-between}.head{height:50px;background:#f5f5f5;border-block:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}.head button{border:0;background:none}.page{padding:18px 15px}.page[hidden]{display:none}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:14px}.tabs button{padding:10px;border:1px solid var(--line);background:#fff}.tabs .active{background:var(--blue);border-color:var(--bl);font-weight:700}.task,.card{width:100%;border:1px solid #999;border-radius:8px;background:#fff;padding:13px;margin:9px 0;text-align:left}.task-top{display:flex;justify-content:space-between;gap:8px}.task small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;background:var(--yellow);border:1px solid var(--yl);border-radius:99px;padding:3px 7px;font-size:11px}.pill.blue{background:var(--blue);border-color:var(--bl)}.btn{width:100%;min-height:48px;margin:6px 0;border-radius:7px;font-weight:700}.primary{background:var(--blue);border:1px solid var(--bl)}.secondary{background:#fff;border:1px solid #666}.warn{background:var(--yellow);border:1px solid var(--yl)}.notice{padding:11px;border:1px solid var(--yl);background:var(--yellow);border-radius:7px;margin:12px 0}.input{width:100%;border:1px solid #999;border-radius:7px;padding:10px}.requirements p{border-bottom:1px solid #ddd;padding:8px 0}.photo-row{border:1px solid #aaa;border-radius:8px;padding:11px;margin:10px 0}.photo-head{display:flex;justify-content:space-between;gap:8px}.square{aspect-ratio:1;background:#eee;display:grid;place-items:center;margin:10px 0;overflow:hidden;border:1px solid #bbb}.square img{width:100%;height:100%;object-fit:cover}.sample{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sample label{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{display:none}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:#fff}.bottom .active{background:var(--blue);font-weight:700}.bottom b{display:block;font-size:18px}.success{text-align:center;padding:70px 10px}.check{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:auto;font-size:36px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:7px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}.hidden{display:none!important}.crop-modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.crop-modal[hidden]{display:none}.crop-panel{width:min(100%,430px);background:#fff;border-radius:12px;padding:16px}.crop-panel h2{margin:0 0 4px}.crop-panel p{margin:0 0 12px;color:var(--muted)}#cropCanvas{display:block;width:100%;aspect-ratio:1;background:#111;border:1px solid #777;touch-action:none;cursor:grab}#cropCanvas.dragging{cursor:grabbing}.zoom-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:14px 0}.zoom-row input{width:100%}.crop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="app"><div class="status"><span>9:41</span><span>●●●</span></div><header class="head"><span id="title">公司任務</span><button id="logout">登出</button></header><main>
<section class="page" id="list"><div class="tabs"><button data-filter="pending" class="active">待完成</button><button data-filter="done">已完成</button><button data-filter="all">全部</button></div><div id="taskList"></div></section>
<section class="page" id="detail" hidden><div class="card"><h2 id="taskTitle"></h2><b id="taskDealer"></b><p>期限：<span id="taskDue"></span></p><p id="taskInstruction"></p></div><div class="card"><h3>拍照項目（<span id="requirementCount">0</span>）</h3><div class="requirements" id="requirements"></div></div><button class="btn primary" id="start">開始執行任務</button><button class="btn warn" id="noPhoto">不拍照完成</button></section>
<section class="page" id="capture" hidden><div id="photoList"></div><button class="btn secondary" id="addPhoto">＋ 新增圖片</button><input class="file" type="file" id="photoInput" accept="image/*" capture="environment"><button class="btn primary" id="complete">完成任務</button></section>
<section class="page" id="reason" hidden><div class="notice">你選定不拍照完成。請說明無法執行這個拍照任務的原因。</div><label><b>無法執行原因（ExecutionNote）＊</b><textarea class="input" id="note" rows="6" placeholder="例如：經銷商目前沒有新機可以布置。"></textarea></label><button class="btn secondary" id="backTask">返回任務</button><button class="btn warn" id="confirmNoPhoto">確認不拍照完成</button></section>
<section class="page" id="success" hidden><div class="success"><div class="check">✓</div><h1>任務已完成</h1><p id="result"></p><button class="btn secondary" id="viewReport">查看任務回報</button><button class="btn primary" id="backList">返回任務清單</button></div></section>
</main><nav class="bottom" aria-label="主要功能"><button id="workbenchNav"><b>⌂</b>工作台</button><button id="dealerNav"><b>▣</b>經銷商</button><button class="active" id="taskNav"><b>✓</b>任務</button><button id="me"><b>●</b>我的</button></nav></div><div class="crop-modal" id="cropModal" hidden><div class="crop-panel"><h2>調整照片位置</h2><p>拖曳照片改變位置，使用縮放調整取景範圍。</p><canvas id="cropCanvas" width="1200" height="1200"></canvas><label class="zoom-row"><span>縮小</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"><span>放大</span></label><div class="crop-actions"><button class="btn secondary" id="cancelCrop">取消</button><button class="btn primary" id="confirmCrop">確認並上傳</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,tasks=[],current=null,filter='pending',slots=[],pendingSlot=null,allowPageLeave=false;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)};async function api(url,opt){const r=await fetch(url,opt),o=await r.json();if(!r.ok)throw new Error(o.error||'操作失敗');return o}function fileUrl(p){return p&&p.startsWith('uploads/')?'/'+p:null}function show(id,label='公司任務',back=null){$$('.page').forEach(p=>p.hidden=p.id!==id);$('#title').innerHTML=back?'<button id="back">‹</button>　'+esc(label):esc(label);if(back)$('#back').onclick=back;window.scrollTo(0,0)}
function hasUnfinishedTask(){return !$('#capture').hidden&&slots.some(s=>!s.uploaded)||!$('#reason').hidden&&$('#note').value.trim()}
function leaveTask(url){if(hasUnfinishedTask()&&!confirm('任務內容尚未完成，確定要離開嗎？'))return;allowPageLeave=true;location.href=url}
function renderTasks(){const rows=tasks.filter(t=>filter==='all'||filter==='done'&&t.completed||filter==='pending'&&!t.completed);$('#taskList').innerHTML=rows.map(t=>`<button class="task" data-id="${t.executionId}"><div class="task-top"><b>${esc(t.title)}</b><span class="pill ${t.sample.length?'blue':''}">${t.sample.length?'核准樣本 '+t.sample.length+' 個拍照項目':'無樣本模式'}</span></div><small>${esc(t.dealer)}｜期限：${esc(t.dueDate)}${t.completed?'｜已回報'+(t.canEdit?'，可修改至 '+esc(t.editUntil.replace('T',' ')):'，已鎖定'):''}</small></button>`).join('')||'<div class="notice">目前沒有符合條件的任務</div>';$$('.task').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.id)))}
function openTask(id){current=tasks.find(t=>t.executionId===id);if(current.canEdit==null)current.canEdit=!current.completed;$('#taskTitle').textContent=current.title;$('#taskDealer').textContent=current.dealer;$('#taskDue').textContent=current.dueDate;$('#taskInstruction').textContent=current.instruction;$('#requirementCount').textContent=current.sample.length;$('#requirements').innerHTML=(current.sample.length?current.sample:[{description:'無核准樣本，可自行新增照片並填寫說明'}]).map((x,i)=>`<p><span class="pill">${i+1}</span>　${esc(x.description)}</p>`).join('');$('#start').disabled=!current.canEdit;$('#start').textContent=current.completed?'修改任務回報':'開始執行任務';$('#noPhoto').disabled=current.completed;show('detail','任務內容',()=>show('list'))}
function buildSlots(){if(current.sample.length){slots=current.sample.map((s,i)=>{const existing=current.photos.find(p=>p.samplePhotoId===s.photoId);return {photoId:existing?.photoId||null,description:s.description,samplePhotoId:s.photoId,sampleUrl:fileUrl(s.filePath),photoUrl:existing?fileUrl(existing.filePath):null,uploaded:!!existing,index:i}})}else{slots=current.photos.map((p,i)=>({photoId:p.photoId,description:p.description,samplePhotoId:null,photoUrl:fileUrl(p.filePath),uploaded:true,index:i}))}renderSlots()}
function renderSlots(){const uploading=slots.some(s=>!s.uploaded);$('#photoList').innerHTML=slots.map((s,i)=>`<article class="photo-row"><div class="photo-head"><b>${i+1}　${esc(s.description)}</b><span>${s.uploaded?'✓ 已上傳':'上傳中…'}</span></div>${s.sampleUrl?`<div class="sample"><label>本次照片<div class="square">${s.photoUrl?`<img src="${s.photoUrl}">`:'尚未拍攝'}</div></label><label>核准樣本<div class="square"><img src="${s.sampleUrl}"></div></label></div>`:`<div class="square">${s.photoUrl?`<img src="${s.photoUrl}">`:'1 : 1 即時取景／預覽'}</div>`}<div class="actions"><button class="btn secondary" data-shoot="${i}" ${current.canEdit?'':'disabled'}>${s.uploaded?'重拍':'拍照／相簿'}</button><button class="btn secondary" data-rename="${i}" ${current.sample.length||!current.canEdit?'disabled':''}>修改說明</button></div></article>`).join('');$$('[data-shoot]').forEach(b=>b.onclick=()=>choosePhoto(Number(b.dataset.shoot)));$$('[data-rename]').forEach(b=>b.onclick=()=>rename(Number(b.dataset.rename)));$('#addPhoto').disabled=current.sample.length>0||!current.canEdit;$('#complete').disabled=!current.canEdit||!slots.length||uploading;$('#complete').textContent=uploading?'圖片上傳中…':current.completed?'確認修改完成':'完成任務'}
function choosePhoto(i){pendingSlot=i;$('#photoInput').value='';$('#photoInput').click()}function rename(i){const v=prompt('照片說明（必填）',slots[i].description);if(v?.trim()){slots[i].description=v.trim();renderSlots()}}function addSlot(){slots.push({description:'新增任務照片',samplePhotoId:null,photoUrl:null,uploaded:false,index:slots.length});renderSlots();choosePhoto(slots.length-1)}
let crop={bitmap:null,file:null,cx:0,cy:0,zoom:1,pointers:new Map(),lastCenter:null,lastDistance:0};
function clampCrop(){if(!crop.bitmap)return;const side=Math.min(crop.bitmap.width,crop.bitmap.height)/crop.zoom,half=side/2;crop.cx=Math.max(half,Math.min(crop.bitmap.width-half,crop.cx));crop.cy=Math.max(half,Math.min(crop.bitmap.height-half,crop.cy))}
function drawCrop(){if(!crop.bitmap)return;clampCrop();const canvas=$('#cropCanvas'),ctx=canvas.getContext('2d'),side=Math.min(crop.bitmap.width,crop.bitmap.height)/crop.zoom;ctx.clearRect(0,0,1200,1200);ctx.drawImage(crop.bitmap,crop.cx-side/2,crop.cy-side/2,side,side,0,0,1200,1200)}
async function openCropEditor(file){try{crop.bitmap?.close();let bitmap;try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bitmap=await createImageBitmap(file)}crop={bitmap,file,cx:bitmap.width/2,cy:bitmap.height/2,zoom:1,pointers:new Map(),lastCenter:null,lastDistance:0};$('#cropZoom').value='1';drawCrop();$('#cropModal').hidden=false}catch(e){toast('無法讀取這張照片：'+e.message)}}
function closeCrop(){crop.bitmap?.close();crop.bitmap=null;crop.file=null;crop.pointers.clear();$('#cropModal').hidden=true}
function canvasJpeg(canvas,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('照片處理失敗')),'image/jpeg',quality))}
async function croppedBlob(){drawCrop();const canvas=$('#cropCanvas'),maxBytes=220*1024,minQuality=.38;let quality=.72,blob=await canvasJpeg(canvas,quality);while(blob.size>maxBytes&&quality>minQuality){quality=Math.max(minQuality,quality-.07);blob=await canvasJpeg(canvas,quality)}return blob}
async function uploadChosen(blob){const slot=slots[pendingSlot],oldPhotoId=slot.photoId;if(!slot.description.trim())return toast('照片說明必填');try{const preview=URL.createObjectURL(blob);slot.photoUrl=preview;slot.uploaded=false;renderSlots();const fd=new FormData();fd.append('description',slot.description);if(slot.samplePhotoId)fd.append('samplePhotoId',slot.samplePhotoId);if(oldPhotoId)fd.append('replacePhotoId',oldPhotoId);fd.append('photo',blob,'photo.jpg');const out=await api('/api/task-executions/'+current.executionId+'/photos',{method:'POST',body:fd});URL.revokeObjectURL(preview);slot.photoId=out.taskPhotoId;slot.photoUrl=out.fileUrl;slot.uploaded=true;current.completed=true;current.submittedAt=out.submittedAt;current.editUntil=out.editUntil;current.canEdit=true;const saved={photoId:out.taskPhotoId,description:slot.description,filePath:out.fileUrl.replace(/^\//,''),samplePhotoId:slot.samplePhotoId};const existing=current.photos.findIndex(p=>p.photoId===oldPhotoId);if(existing>=0)current.photos[existing]=saved;else current.photos.push(saved);renderSlots();toast('照片已上傳，桌機已計入完成進度')}catch(e){slot.uploaded=!!oldPhotoId;renderSlots();toast(e.message)}}
async function finish(note=null){const button=note?$('#confirmNoPhoto'):$('#complete');if(button.disabled)return;try{if(!note&&slots.some(s=>!s.uploaded))return toast('圖片仍在上傳中');if(current.completed&&!note){openTask(current.executionId);return}button.disabled=true;const out=await api('/api/task-executions/'+current.executionId+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photoCount:note?0:slots.length,executionNote:note})});current.completed=true;current.submittedAt=out.submittedAt;$('#result').innerHTML=`${esc(current.title)}<br>${note?'本次未拍照／原因已送出':'照片：'+slots.length+' 張，全部上傳成功'}<br>完成時間：${esc(out.submittedAt.replace('T',' '))}`;show('success','任務完成')}catch(e){toast(e.message)}finally{button.disabled=false}}
function cropGestureState(){const points=[...crop.pointers.values()];if(!points.length)return {center:null,distance:0};const center={x:points.reduce((n,p)=>n+p.x,0)/points.length,y:points.reduce((n,p)=>n+p.y,0)/points.length};const distance=points.length>1?Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y):0;return {center,distance}}
function startCropGesture(e){e.preventDefault();$('#cropCanvas').setPointerCapture(e.pointerId);crop.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const state=cropGestureState();crop.lastCenter=state.center;crop.lastDistance=state.distance;$('#cropCanvas').classList.add('dragging')}
function moveCropGesture(e){if(!crop.pointers.has(e.pointerId)||!crop.bitmap)return;e.preventDefault();crop.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const state=cropGestureState(),canvas=$('#cropCanvas'),sourceSide=Math.min(crop.bitmap.width,crop.bitmap.height)/crop.zoom;if(crop.lastCenter&&state.center){crop.cx-=(state.center.x-crop.lastCenter.x)*sourceSide/canvas.clientWidth;crop.cy-=(state.center.y-crop.lastCenter.y)*sourceSide/canvas.clientHeight}if(state.distance&&crop.lastDistance){crop.zoom=Math.max(1,Math.min(3,crop.zoom*state.distance/crop.lastDistance));$('#cropZoom').value=String(crop.zoom)}crop.lastCenter=state.center;crop.lastDistance=state.distance;drawCrop()}
function endCropGesture(e){crop.pointers.delete(e.pointerId);const state=cropGestureState();crop.lastCenter=state.center;crop.lastDistance=state.distance;if(!crop.pointers.size)$('#cropCanvas').classList.remove('dragging')}
async function init(){try{[me,tasks]=await Promise.all([api('/api/auth/me'),api('/api/photo-tasks')]);renderTasks()}catch(e){toast(e.message)}}$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderTasks()});$('#start').onclick=()=>{buildSlots();show('capture',current.title+'（'+slots.filter(s=>s.uploaded).length+'/'+slots.length+'）',()=>openTask(current.executionId))};$('#noPhoto').onclick=()=>show('reason','不拍照完成',()=>openTask(current.executionId));$('#backTask').onclick=()=>openTask(current.executionId);$('#addPhoto').onclick=addSlot;$('#photoInput').onchange=e=>e.target.files[0]&&openCropEditor(e.target.files[0]);$('#cropZoom').oninput=e=>{crop.zoom=Number(e.target.value);drawCrop()};$('#cropCanvas').onpointerdown=startCropGesture;$('#cropCanvas').onpointermove=moveCropGesture;$('#cropCanvas').onpointerup=endCropGesture;$('#cropCanvas').onpointercancel=endCropGesture;$('#cancelCrop').onclick=closeCrop;$('#confirmCrop').onclick=async()=>{const button=$('#confirmCrop');button.disabled=true;try{const blob=await croppedBlob();closeCrop();await uploadChosen(blob)}catch(e){toast(e.message)}finally{button.disabled=false}};$('#complete').onclick=()=>finish();$('#confirmNoPhoto').onclick=()=>{const n=$('#note').value.trim();if(!n)return toast('無法執行原因必填');finish(n)};$('#backList').onclick=()=>{renderTasks();show('list')};$('#viewReport').onclick=()=>{buildSlots();show('capture','任務回報',()=>show('success','任務完成'))};$('#workbenchNav').onclick=()=>leaveTask('/mobile');$('#dealerNav').onclick=()=>leaveTask('/mobile#dealers');$('#taskNav').onclick=()=>{if(hasUnfinishedTask()&&!confirm('任務內容尚未完成，確定返回任務清單嗎？'))return;show('list')};$('#me').onclick=()=>toast((me?.name||'')+'｜Passkey 已登入');$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login/employee'};addEventListener('beforeunload',e=>{if(!allowPageLeave&&hasUnfinishedTask()){e.preventDefault();e.returnValue=''}});init();
</script></body></html>
