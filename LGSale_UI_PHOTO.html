<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LGSale｜公司任務</title>
<style>
:root{--blue:#dae8fc;--bl:#6c8ebf;--yellow:#fff2cc;--yl:#d6b656;--green:#d5e8d4;--line:#ccc;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#222;font:14px/1.45 "Segoe UI","Noto Sans TC",sans-serif}button,input,textarea{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;padding-bottom:70px}.status{height:24px;padding:4px 18px;font-size:11px;display:flex;justify-content:space-between}.head{height:50px;background:#f5f5f5;border-block:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px}.head button{border:0;background:none}.page{padding:18px 15px}.page[hidden]{display:none}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:14px}.tabs button{padding:10px;border:1px solid var(--line);background:#fff}.tabs .active{background:var(--blue);border-color:var(--bl);font-weight:700}.task,.card{width:100%;border:1px solid #999;border-radius:8px;background:#fff;padding:13px;margin:9px 0;text-align:left}.task-top{display:flex;justify-content:space-between;gap:8px}.task small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;background:var(--yellow);border:1px solid var(--yl);border-radius:99px;padding:3px 7px;font-size:11px}.pill.blue{background:var(--blue);border-color:var(--bl)}.btn{width:100%;min-height:48px;margin:6px 0;border-radius:7px;font-weight:700}.primary{background:var(--blue);border:1px solid var(--bl)}.secondary{background:#fff;border:1px solid #666}.warn{background:var(--yellow);border:1px solid var(--yl)}.notice{padding:11px;border:1px solid var(--yl);background:var(--yellow);border-radius:7px;margin:12px 0}.input{width:100%;border:1px solid #999;border-radius:7px;padding:10px}.requirements p{border-bottom:1px solid #ddd;padding:8px 0}.photo-row{border:1px solid #aaa;border-radius:8px;padding:11px;margin:10px 0}.photo-head{display:flex;justify-content:space-between;gap:8px}.square{aspect-ratio:1;background:#eee;display:grid;place-items:center;margin:10px 0;overflow:hidden;border:1px solid #bbb}.square img{width:100%;height:100%;object-fit:cover}.sample{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sample label{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{display:none}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:#fff}.bottom .active{background:var(--blue);font-weight:700}.bottom b{display:block;font-size:18px}.success{text-align:center;padding:70px 10px}.check{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:auto;font-size:36px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:7px;opacity:0;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}
</style></head><body><div class="app"><div class="status"><span>9:41</span><span>●●●</span></div><header class="head"><span id="title">公司任務</span><button id="logout">登出</button></header><main>
<section class="page" id="list"><div class="tabs"><button data-filter="pending" class="active">待完成</button><button data-filter="done">已完成</button><button data-filter="all">全部</button></div><div id="taskList"></div></section>
<section class="page" id="detail" hidden><div class="card"><h2 id="taskTitle"></h2><b id="taskDealer"></b><p>期限：<span id="taskDue"></span></p><p id="taskInstruction"></p></div><div class="card"><h3>拍照項目（<span id="requirementCount">0</span>）</h3><div class="requirements" id="requirements"></div></div><button class="btn primary" id="start">開始執行任務</button><button class="btn warn" id="noPhoto">不拍照完成</button></section>
<section class="page" id="capture" hidden><div id="photoList"></div><button class="btn secondary" id="addPhoto">＋ 新增圖片</button><input class="file" type="file" id="photoInput" accept="image/*" capture="environment"><button class="btn primary" id="complete">完成任務</button></section>
<section class="page" id="reason" hidden><div class="notice">你選定不拍照完成。請說明無法執行這個拍照任務的原因。</div><label><b>無法執行原因（ExecutionNote）＊</b><textarea class="input" id="note" rows="6" placeholder="例如：經銷商目前沒有新機可以布置。"></textarea></label><button class="btn secondary" id="backTask">返回任務</button><button class="btn warn" id="confirmNoPhoto">確認不拍照完成</button></section>
<section class="page" id="success" hidden><div class="success"><div class="check">✓</div><h1>任務已完成</h1><p id="result"></p><button class="btn secondary" id="viewReport">查看任務回報</button><button class="btn primary" id="backList">返回任務清單</button></div></section>
</main><nav class="bottom" aria-label="主要功能"><button id="workbenchNav"><b>⌂</b>工作台</button><button id="dealerNav"><b>▣</b>經銷商</button><button class="active" id="taskNav"><b>✓</b>任務</button><button id="me"><b>●</b>我的</button></nav></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,tasks=[],current=null,filter='pending',slots=[],pendingSlot=null,allowPageLeave=false;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)};async function api(url,opt){const r=await fetch(url,opt),o=await r.json();if(!r.ok)throw new Error(o.error||'操作失敗');return o}function fileUrl(p){return p&&p.startsWith('uploads/')?'/'+p:null}function show(id,label='公司任務',back=null){$$('.page').forEach(p=>p.hidden=p.id!==id);$('#title').innerHTML=back?'<button id="back">‹</button>　'+esc(label):esc(label);if(back)$('#back').onclick=back;window.scrollTo(0,0)}
function hasUnfinishedTask(){return !$('#capture').hidden&&slots.some(s=>!s.uploaded)||!$('#reason').hidden&&$('#note').value.trim()}
function leaveTask(url){if(hasUnfinishedTask()&&!confirm('任務內容尚未完成，確定要離開嗎？'))return;allowPageLeave=true;location.href=url}
function renderTasks(){const rows=tasks.filter(t=>filter==='all'||filter==='done'&&t.completed||filter==='pending'&&!t.completed);$('#taskList').innerHTML=rows.map(t=>`<button class="task" data-id="${t.executionId}"><div class="task-top"><b>${esc(t.title)}</b><span class="pill ${t.sample.length?'blue':''}">${t.sample.length?'核准樣本 '+t.sample.length+' 個拍照項目':'無樣本模式'}</span></div><small>${esc(t.dealer)}｜期限：${esc(t.dueDate)}${t.completed?'｜已完成':''}</small></button>`).join('')||'<div class="notice">目前沒有符合條件的任務</div>';$$('.task').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.id)))}
function openTask(id){current=tasks.find(t=>t.executionId===id);$('#taskTitle').textContent=current.title;$('#taskDealer').textContent=current.dealer;$('#taskDue').textContent=current.dueDate;$('#taskInstruction').textContent=current.instruction;$('#requirementCount').textContent=current.sample.length;$('#requirements').innerHTML=(current.sample.length?current.sample:[{description:'無核准樣本，可自行新增照片並填寫說明'}]).map((x,i)=>`<p><span class="pill">${i+1}</span>　${esc(x.description)}</p>`).join('');$('#start').disabled=current.completed;$('#noPhoto').disabled=current.completed;show('detail','任務內容',()=>show('list'))}
function buildSlots(){if(current.sample.length){slots=current.sample.map((s,i)=>{const existing=current.photos.find(p=>p.samplePhotoId===s.photoId);return {photoId:existing?.photoId||null,description:s.description,samplePhotoId:s.photoId,sampleUrl:fileUrl(s.filePath),photoUrl:existing?fileUrl(existing.filePath):null,uploaded:!!existing,index:i}})}else{slots=current.photos.map((p,i)=>({photoId:p.photoId,description:p.description,samplePhotoId:null,photoUrl:fileUrl(p.filePath),uploaded:true,index:i}))}renderSlots()}
function renderSlots(){$('#photoList').innerHTML=slots.map((s,i)=>`<article class="photo-row"><div class="photo-head"><b>${i+1}　${esc(s.description)}</b><span>${s.uploaded?'✓ 已上傳':'等待拍攝'}</span></div>${s.sampleUrl?`<div class="sample"><label>本次照片<div class="square">${s.photoUrl?`<img src="${s.photoUrl}">`:'尚未拍攝'}</div></label><label>核准樣本<div class="square"><img src="${s.sampleUrl}"></div></label></div>`:`<div class="square">${s.photoUrl?`<img src="${s.photoUrl}">`:'1 : 1 即時取景／預覽'}</div>`}<div class="actions"><button class="btn secondary" data-shoot="${i}">${s.uploaded?'重拍':'拍照／相簿'}</button><button class="btn secondary" data-rename="${i}" ${current.sample.length?'disabled':''}>修改說明</button></div></article>`).join('');$$('[data-shoot]').forEach(b=>b.onclick=()=>choosePhoto(Number(b.dataset.shoot)));$$('[data-rename]').forEach(b=>b.onclick=()=>rename(Number(b.dataset.rename)));$('#addPhoto').disabled=current.sample.length>0;$('#complete').disabled=!slots.length||slots.some(s=>!s.uploaded)}
function choosePhoto(i){pendingSlot=i;$('#photoInput').value='';$('#photoInput').click()}function rename(i){const v=prompt('照片說明（必填）',slots[i].description);if(v?.trim()){slots[i].description=v.trim();renderSlots()}}function addSlot(){slots.push({description:'新增任務照片',samplePhotoId:null,photoUrl:null,uploaded:false,index:slots.length});renderSlots();choosePhoto(slots.length-1)}
async function cropSquare(file){const bmp=await createImageBitmap(file),side=Math.min(bmp.width,bmp.height),sx=(bmp.width-side)/2,sy=(bmp.height-side)/2,canvas=document.createElement('canvas');canvas.width=canvas.height=1200;canvas.getContext('2d').drawImage(bmp,sx,sy,side,side,0,0,1200,1200);bmp.close();return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9))}
async function uploadChosen(file){const slot=slots[pendingSlot],oldPhotoId=slot.photoId;if(!slot.description.trim())return toast('照片說明必填');try{slot.photoUrl=URL.createObjectURL(file);slot.uploaded=false;renderSlots();const blob=await cropSquare(file),fd=new FormData();fd.append('description',slot.description);if(slot.samplePhotoId)fd.append('samplePhotoId',slot.samplePhotoId);if(oldPhotoId)fd.append('replacePhotoId',oldPhotoId);fd.append('photo',blob,'photo.jpg');const out=await api('/api/task-executions/'+current.executionId+'/photos',{method:'POST',body:fd});slot.photoId=out.taskPhotoId;slot.photoUrl=out.fileUrl;slot.uploaded=true;const saved={photoId:out.taskPhotoId,description:slot.description,filePath:out.fileUrl.replace(/^\//,''),samplePhotoId:slot.samplePhotoId};const existing=current.photos.findIndex(p=>p.photoId===oldPhotoId);if(existing>=0)current.photos[existing]=saved;else current.photos.push(saved);renderSlots()}catch(e){toast(e.message)}}
async function finish(note=null){try{if(!note&&current.sample.length&&slots.some(s=>!s.uploaded))return toast('補齊所有樣本對應照片後才能完成任務');if(!note&&!current.sample.length&&slots.some(s=>!s.uploaded))return toast('尚有照片未完成上傳');const out=await api('/api/task-executions/'+current.executionId+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photoCount:note?0:slots.length,executionNote:note})});current.completed=true;current.submittedAt=out.submittedAt;$('#result').innerHTML=`${esc(current.title)}<br>${note?'本次未拍照／原因已送出':'照片：'+slots.length+' 張，全部上傳成功'}<br>完成時間：${esc(out.submittedAt.replace('T',' '))}`;show('success','任務完成')}catch(e){toast(e.message)}}
async function init(){try{[me,tasks]=await Promise.all([api('/api/auth/me'),api('/api/photo-tasks')]);renderTasks()}catch(e){toast(e.message)}}$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderTasks()});$('#start').onclick=()=>{buildSlots();show('capture',current.title+'（'+slots.filter(s=>s.uploaded).length+'/'+slots.length+'）',()=>openTask(current.executionId))};$('#noPhoto').onclick=()=>show('reason','不拍照完成',()=>openTask(current.executionId));$('#backTask').onclick=()=>openTask(current.executionId);$('#addPhoto').onclick=addSlot;$('#photoInput').onchange=e=>e.target.files[0]&&uploadChosen(e.target.files[0]);$('#complete').onclick=()=>finish();$('#confirmNoPhoto').onclick=()=>{const n=$('#note').value.trim();if(!n)return toast('無法執行原因必填');finish(n)};$('#backList').onclick=()=>{renderTasks();show('list')};$('#viewReport').onclick=()=>{buildSlots();show('capture','任務回報',()=>show('success','任務完成'))};$('#workbenchNav').onclick=()=>leaveTask('/mobile');$('#dealerNav').onclick=()=>leaveTask('/mobile#dealers');$('#taskNav').onclick=()=>{if(hasUnfinishedTask()&&!confirm('任務內容尚未完成，確定返回任務清單嗎？'))return;show('list')};$('#me').onclick=()=>toast((me?.name||'')+'｜Passkey 已登入');$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login/employee'};addEventListener('beforeunload',e=>{if(!allowPageLeave&&hasUnfinishedTask()){e.preventDefault();e.returnValue=''}});init();
</script></body></html>
