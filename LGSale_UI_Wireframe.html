<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LGSale｜實銷與陳列</title>
  <style>
    :root{--blue:#dae8fc;--blue-line:#6c8ebf;--yellow:#fff2cc;--yellow-line:#d6b656;--red:#f8cecc;--red-line:#b85450;--green:#d5e8d4;--ink:#222;--muted:#6b7280;--line:#d1d5db;--bg:#eef1f4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 "Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;position:relative;padding-bottom:72px;box-shadow:0 0 30px #0002}.statusbar{height:24px;padding:4px 18px;display:flex;justify-content:space-between;font-size:11px}.header{min-height:50px;padding:0 15px;border-block:1px solid #ccc;background:#f5f5f5;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}.header button{border:0;background:none}.page{padding:20px 15px}.page[hidden]{display:none}.hello{font-size:20px;font-weight:700;margin:0 0 15px}.card{border:1px solid #999;border-radius:8px;padding:14px;margin:12px 0;background:#fff}.card.yellow{background:var(--yellow);border-color:var(--yellow-line)}.card h2{font-size:15px;margin:0 0 8px}.row-button{width:100%;border:1px solid #aaa;border-radius:8px;background:#fff;padding:12px;text-align:left;margin:7px 0;display:flex;justify-content:space-between;gap:8px}.row-button small{display:block;color:var(--muted);margin-top:3px}.search-row{display:grid;grid-template-columns:1fr 42px;gap:8px}.input{width:100%;border:1px solid #999;border-radius:7px;background:#fff;padding:11px}.clear{border:1px solid var(--red-line);background:var(--red);border-radius:7px;font-size:20px;font-weight:700}.clear:disabled,.pager button:disabled{background:#eee;border-color:#ccc;color:#aaa}.pager{display:grid;grid-template-columns:1fr 1.3fr 1fr;margin:10px 0}.pager button,.pager span{height:44px;border:1px solid var(--blue-line);background:var(--blue);font-weight:700;display:grid;place-items:center}.pager span{background:var(--yellow);border-color:var(--yellow-line)}.grid{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:12px}.grid th{background:var(--blue);border:1px solid var(--blue-line);padding:7px 3px}.grid td{border:1px solid #ccc;padding:9px 4px;text-align:center}.grid th:first-child,.grid td:first-child{width:54%;text-align:left;padding-left:7px;overflow-wrap:anywhere}.grid .action{color:#3f6ca8;font-size:18px;font-weight:700;cursor:pointer}.grid .display-on{background:var(--green);font-weight:700}.grid tr.focus td{background:var(--yellow);border:2px solid #d79b00}.grid tr.focus td.display-on{background:var(--green)}.primary,.secondary,.warn{width:100%;min-height:48px;border-radius:7px;font-weight:700;margin:6px 0}.primary{background:var(--blue);border:1px solid var(--blue-line)}.secondary{background:#fff;border:1px solid #666}.warn{background:var(--yellow);border:1px solid var(--yellow-line)}.sticky-next{position:sticky;bottom:70px;margin:16px -15px -20px;padding:12px 15px;background:var(--blue);border-top:1px solid var(--blue-line);display:flex;justify-content:space-between;align-items:center}.sticky-next button{border:0;background:none;font-weight:700}.notice{border:1px solid var(--yellow-line);background:var(--yellow);border-radius:7px;padding:11px;margin:12px 0}.muted{color:var(--muted)}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:66px;border-top:1px solid #ccc;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.bottom button{border:0;background:#fff;color:#666}.bottom button.active{background:var(--blue);color:#244b7a;font-weight:700}.bottom b{display:block;font-size:19px}.success{text-align:center;padding:70px 15px}.check{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--green);font-size:36px}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}.hidden{display:none!important}
  </style>
</head>
<body><div class="app">
  <div class="statusbar"><span id="clock">9:41</span><span>●●●</span></div>
  <header class="header"><span id="headerTitle">LGSale　我的工作台</span><button id="logout">登出</button></header>
  <main>
    <section class="page" id="home"><p class="hello"><span id="helloName">您好</span><br><small id="suggestedText">正在載入巡店資料…</small></p><div class="card"><h2>今日建議巡店　<b id="suggestedCount">0</b></h2><div id="suggested"></div></div><div class="card"><h2>最近巡店紀錄</h2><button class="row-button" data-record-filter="editable"><span>可修改的業務回報<small>仍在 72 小時修改期限內</small></span><b id="editableCount">0 筆　›</b></button><button class="row-button" data-record-filter="dealer"><span>經銷商自行回報<small>業務帳號不可修改</small></span><b id="dealerReportCount">0 筆　›</b></button><button class="row-button" data-record-filter="locked"><span>已鎖定紀錄<small>超過 72 小時，僅能查看</small></span><b id="lockedCount">0 筆　›</b></button></div></section>
    <section class="page" id="dealers" hidden><input class="input" id="dealerSearch" placeholder="🔍 搜尋代碼或經銷商名稱"><div id="dealerList"></div></section>
    <section class="page" id="dealerHome" hidden><div class="card" id="dealerIdentity"></div><div class="card yellow" id="dealerRecent"></div><div class="card" id="dealerLast"></div><button class="primary" id="startVisit">開始本次巡店</button><button class="secondary" id="dealerRecords">查看巡店紀錄／可修改資料</button></section>
    <section class="page" id="records" hidden><div class="notice" id="recordHint">巡店紀錄</div><input class="input" id="recordSearch" placeholder="🔍 搜尋經銷商或回報日期"><p><b id="recordCount">巡店回報（0）</b></p><div id="recordList"></div></section>
    <section class="page" id="editor" hidden><div class="search-row"><input class="input" id="productSearch" placeholder="🔍 搜尋型號"><button class="clear" id="clearSearch" disabled>×</button></div><div class="pager"><button id="prevProduct" disabled>← 上一筆</button><span id="matchCount">尚未搜尋</span><button id="nextProduct" disabled>下一筆 →</button></div><div id="noProducts" class="notice hidden">本月沒有可回報型號。請聯絡管理人員確認有效的正式期初庫存資料。</div><table class="grid"><thead><tr><th>型號</th><th>實銷</th><th>陳列</th><th>日期</th></tr></thead><tbody id="productRows"></tbody></table><div class="sticky-next"><b>已填 <span id="filledCount">0</span> 項</b><button id="toReview">下一步 ›</button></div></section>
    <section class="page" id="review" hidden><div class="card" id="reviewDealer"></div><div class="card yellow" id="reviewStats"></div><table class="grid"><thead><tr><th>型號</th><th>實銷</th><th>陳列</th><th>日期</th></tr></thead><tbody id="reviewRows"></tbody></table><div class="notice">送出後將開始計算 72 小時修改期限。</div><button class="primary" id="submitVisit">確認送出</button><button class="secondary" data-back="editor">返回修改</button></section>
    <section class="page" id="detail" hidden><div id="detailStatus" class="notice"></div><div class="card" id="detailMeta"></div><table class="grid"><thead><tr><th>型號</th><th>實銷</th><th>陳列</th><th>日期</th></tr></thead><tbody id="detailRows"></tbody></table><button class="primary" id="editVisit">修改回報</button><div class="notice hidden" id="readonlyReason"></div></section>
    <section class="page" id="success" hidden><div class="success"><div class="check">✓</div><h1>巡店回報已送出</h1><p id="successText"></p><button class="primary" id="viewSubmitted">查看本次回報</button><button class="secondary" data-go="home">返回工作台</button></div></section>
  </main>
  <nav class="bottom" id="employeeNav"><button data-go="home" class="active"><b>⌂</b>首頁</button><button data-go="dealers"><b>▣</b>經銷商</button><button onclick="location.href='/photo'"><b>✓</b>任務</button><button id="myButton"><b>●</b>我的</button></nav>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,dashboard,dealers=[],selectedDealer=null,products=[],values=new Map(),matches=[],matchIndex=-1,visits=[],recordFilter='all',editingVisitId=null,lastSubmittedId=null;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)};
const fmt=v=>v?String(v).replace('T',' ').replaceAll('-','/'):'—';
const elapsed=v=>{if(!v)return '尚無巡店';const days=Math.floor((Date.now()-new Date(v).getTime())/86400000);return days<=0?'今天':days===1?'昨天':days+' 天前'};
function title(text,back){$('#headerTitle').innerHTML=back?'<button id="headerBack">‹</button>　'+esc(text):esc(text);if(back)$('#headerBack').onclick=back}
function show(id){$$('.page').forEach(p=>p.hidden=p.id!==id);$$('.bottom button[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));window.scrollTo(0,0);if(id==='home')title(me?.type==='DEALER'?'LGSale　經銷商回報':'LGSale　我的工作台')}
async function api(url,options){const r=await fetch(url,options),out=await r.json();if(!r.ok)throw new Error(out.error||'操作失敗');return out}
function dealerButton(d){return `<button class="row-button" data-dealer="${d.id}"><span><b>${esc(d.name)}</b><small>${esc(d.code)}｜${esc(d.level)} 級<br>上次巡店：${fmt(d.lastVisit)}（${elapsed(d.lastVisit)}）</small></span><b>›</b></button>`}
function bindDealerButtons(){$$('[data-dealer]').forEach(b=>b.onclick=()=>openDealer(Number(b.dataset.dealer)))}
function renderHome(){const suggested=dealers.slice(0,3);$('#helloName').textContent=(me.name||'使用者')+'，您好';$('#suggestedText').textContent=me.type==='DEALER'?'只能回報本經銷商資料':'今天有 '+suggested.length+' 家建議巡店';$('#suggestedCount').textContent=suggested.length;$('#suggested').innerHTML=suggested.map(dealerButton).join('');bindDealerButtons();const c=dashboard.counts;$('#editableCount').textContent=c.editable+' 筆　›';$('#dealerReportCount').textContent=c.dealer+' 筆　›';$('#lockedCount').textContent=c.locked+' 筆　›'}
function renderDealers(list=dealers){$('#dealerList').innerHTML=list.map(dealerButton).join('')||'<div class="notice">沒有可查看的經銷商</div>';bindDealerButtons()}
async function openDealer(id){selectedDealer=dealers.find(d=>d.id===id);if(!selectedDealer)return;const s=await api('/api/dealers/'+id+'/summary');$('#dealerIdentity').innerHTML=`<b>${esc(selectedDealer.name)}　${esc(selectedDealer.level)} 級</b><br>${esc(selectedDealer.code)}<br>負責業務：${esc(selectedDealer.employee)}`;$('#dealerRecent').innerHTML=`<b>最近巡店</b><br>${fmt(s.lastVisit)}<br>距今　${elapsed(s.lastVisit)}<br>資料狀態　${s.lastVisit?'已有回報':'需更新'}`;$('#dealerLast').innerHTML=`<b>上次回報摘要</b><br>已填商品 ${s.detailCount} 項｜實銷 ${s.sellOutTotal}｜陳列 ${s.displayTotal}`;show('dealerHome');title('經銷商摘要',()=>show(me.type==='DEALER'?'home':'dealers'))}
function filteredRecords(){const q=$('#recordSearch').value.trim().toLowerCase();return visits.filter(v=>(recordFilter==='all'||recordFilter==='editable'&&v.canEdit&&v.entrySourceType==='EMPLOYEE'||recordFilter==='dealer'&&v.entrySourceType==='DEALER'||recordFilter==='locked'&&!v.canEdit)&&(!q||(v.dealer+v.reportDateTime+v.code).toLowerCase().includes(q)))}
function renderRecords(){const rows=filteredRecords();$('#recordCount').textContent='巡店回報（'+rows.length+'）';$('#recordList').innerHTML=rows.map(v=>`<button class="row-button" data-visit="${v.id}"><span><b>${esc(v.dealer)}</b><small>回報：${fmt(v.reportDateTime)}<br>${v.entrySourceType==='EMPLOYEE'?'業務回報':'經銷商回報'}｜${v.canEdit?'剩餘 '+Math.floor(v.remainingMinutes/60)+' 小時可修改':'唯讀'}</small></span><b>›</b></button>`).join('')||'<div class="notice">找不到符合條件的紀錄</div>';$$('[data-visit]').forEach(b=>b.onclick=()=>openVisit(Number(b.dataset.visit)))}
async function openRecords(filter='all',dealerId=null){recordFilter=filter;const query=dealerId?'?dealerId='+dealerId:(me.type==='EMPLOYEE'?'?mine=1':'');visits=await api('/api/visits'+query);const hints={editable:'只顯示由業務建立，且仍在 72 小時修改期限內的回報。',dealer:'經銷商自行回報，業務帳號只能查看。',locked:'已超過修改期限或作廢的回報，只能查看。',all:'全部巡店紀錄（包含唯讀資料）。'};$('#recordHint').textContent=hints[filter];renderRecords();show('records');title('選擇巡店紀錄',()=>show(selectedDealer?'dealerHome':'home'))}
async function beginEditor(visit=null){editingVisitId=visit?.id||null;products=await api('/api/products?dealerId='+(visit?.dealerId||selectedDealer.id));values=new Map();if(visit)visit.details.forEach(x=>{values.set(x.productId,{sell:x.sellOutQuantity,date:x.sellOutDate,display:x.displayQuantity});if(!products.some(p=>p.id===x.productId))products.push({id:x.productId,code:x.code,name:x.name,category:''})});$('#productSearch').value='';updateMatches();renderProducts();show('editor');title((visit?'修改巡店回報':selectedDealer.name)+'　　暫存',()=>visit?openVisit(visit.id):show('dealerHome'))}
function updateMatches(){const q=$('#productSearch').value.trim().toLowerCase();matches=q?products.map(p=>p).filter(p=>(p.code+p.name).toLowerCase().includes(q)):[];matchIndex=matches.length?0:-1;$('#clearSearch').disabled=!q;$('#prevProduct').disabled=matches.length<2;$('#nextProduct').disabled=matches.length<2;$('#matchCount').textContent=q?(matches.length?'第 1／'+matches.length+' 筆':'找到 0 筆'):'尚未搜尋'}
function renderProducts(){const focus=matchIndex>=0?matches[matchIndex]?.id:null;$('#noProducts').classList.toggle('hidden',products.length>0);$('#productRows').innerHTML=products.map(p=>{const v=values.get(p.id)||{};return `<tr class="${p.id===focus?'focus':''}" id="product-${p.id}"><td><b>${esc(p.code)}</b><br><small>${esc(p.name)}</small></td><td class="action" data-sell="${p.id}">${v.sell??'＋'}</td><td class="action ${v.display?'display-on':''}" data-display="${p.id}">${v.display??'＋'}</td><td>${v.date?String(v.date).slice(5).replace('-','/'):' '}</td></tr>`}).join('');$$('[data-sell]').forEach(c=>c.onclick=()=>editSell(Number(c.dataset.sell)));$$('[data-display]').forEach(c=>c.onclick=()=>toggleDisplay(Number(c.dataset.display)));$('#filledCount').textContent=[...values.values()].filter(v=>v.sell||v.display).length;if(focus)setTimeout(()=>$('#product-'+focus)?.scrollIntoView({block:'center',behavior:'smooth'}),0)}
function editSell(id){const old=values.get(id)||{},raw=prompt('實銷數量（1～10）；留空表示清除',old.sell??'');if(raw===null)return;if(raw.trim()===''){old.sell=null;old.date=null}else{const n=Number(raw);if(!Number.isInteger(n)||n<1||n>10)return toast('實銷只接受 1～10');old.sell=n;old.date=old.date||new Date().toISOString().slice(0,10)};if(!old.sell&&!old.display)values.delete(id);else values.set(id,old);renderProducts()}
function toggleDisplay(id){const v=values.get(id)||{};v.display=v.display?null:1;if(!v.sell&&!v.display)values.delete(id);else values.set(id,v);renderProducts()}
function moveMatch(delta){if(!matches.length)return;matchIndex=(matchIndex+delta+matches.length)%matches.length;$('#matchCount').textContent='第 '+(matchIndex+1)+'／'+matches.length+' 筆';renderProducts()}
function detailPayload(){return products.map(p=>{const v=values.get(p.id)||{};return {productId:p.id,code:p.code,name:p.name,sellOutQuantity:v.sell||null,sellOutDate:v.sell?v.date:null,displayQuantity:v.display||null}}).filter(x=>x.sellOutQuantity||x.displayQuantity)}
function review(){const d=detailPayload();if(!d.length)return toast('請至少填寫一項商品');const sell=d.filter(x=>x.sellOutQuantity).length,display=d.filter(x=>x.displayQuantity).length;$('#reviewDealer').innerHTML=`<b>${esc(selectedDealer.name)}</b><br>${esc(selectedDealer.code)}｜${new Date().toISOString().slice(0,10).replaceAll('-','/')}`;$('#reviewStats').innerHTML=`<b>本次填寫摘要</b><br>商品　${d.length} 項<br>有填實銷　${sell} 項<br>只有陳列　${d.filter(x=>!x.sellOutQuantity&&x.displayQuantity).length} 項<br>有填陳列　${display} 項`;$('#reviewRows').innerHTML=d.map(x=>`<tr><td>${esc(x.code)}</td><td>${x.sellOutQuantity??''}</td><td>${x.displayQuantity??''}</td><td>${x.sellOutDate?x.sellOutDate.slice(5).replace('-','/'):''}</td></tr>`).join('');show('review');title('送出前確認',()=>show('editor'))}
async function submit(){const details=detailPayload(),opts={method:editingVisitId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dealerId:selectedDealer.id,details})};try{const out=await api(editingVisitId?'/api/visits/'+editingVisitId:'/api/visits',opts);lastSubmittedId=editingVisitId||out.storeVisitId;$('#successText').innerHTML=`${fmt(out.reportDateTime||out.updatedAt||new Date().toISOString())}<br><br>共回報 ${details.length} 項商品`;show('success');title('巡店回報完成')}catch(e){toast(e.message)}}
async function openVisit(id){const v=await api('/api/visits/'+id);selectedDealer=dealers.find(d=>d.id===v.dealerId)||{id:v.dealerId,name:v.dealer,code:v.dealerCode};$('#detailStatus').textContent=v.canEdit?'已送出｜尚可修改至 '+fmt(v.editableUntil):(v.entrySourceType==='DEALER'?'經銷商自行回報｜業務僅能查看':'已鎖定｜修改期限已結束');$('#detailMeta').innerHTML=`<b>${esc(v.dealer)}</b><br>回報：${fmt(v.reportDateTime)}<br>填寫者：${esc(v.createdBy)}<br>正式負責：${esc(v.responsibleEmployee)}`;$('#detailRows').innerHTML=v.details.map(x=>`<tr><td>${esc(x.code)}</td><td>${x.sellOutQuantity??''}</td><td>${x.displayQuantity??''}</td><td>${x.sellOutDate?x.sellOutDate.slice(5).replace('-','/'):''}</td></tr>`).join('');$('#editVisit').classList.toggle('hidden',!v.canEdit);$('#editVisit').onclick=()=>beginEditor(v);$('#readonlyReason').classList.toggle('hidden',v.canEdit);$('#readonlyReason').textContent=v.entrySourceType==='DEALER'?'此筆由經銷商帳號建立，業務無修改權限':'此筆回報已超過 72 小時修改期限。資料仍完整顯示。';show('detail');title('巡店詳細',()=>openRecords('all',selectedDealer.id))}
async function init(){try{[me,dashboard]=await Promise.all([api('/api/auth/me'),api('/api/mobile-dashboard')]);dealers=dashboard.dealers;renderHome();renderDealers();const linked=location.hash.match(/^#visit-(\d+)$/);if(linked){await openVisit(Number(linked[1]))}else if(me.type==='DEALER'){selectedDealer=dealers[0];$('#employeeNav button:nth-child(2)').classList.add('hidden');$('#employeeNav button:nth-child(3)').classList.add('hidden');await openDealer(selectedDealer.id)}}catch(e){toast(e.message)}}
$('#dealerSearch').oninput=e=>renderDealers(dealers.filter(d=>(d.name+d.code).toLowerCase().includes(e.target.value.toLowerCase())));$('#recordSearch').oninput=renderRecords;$('#productSearch').oninput=()=>{updateMatches();renderProducts()};$('#clearSearch').onclick=()=>{$('#productSearch').value='';updateMatches();renderProducts()};$('#prevProduct').onclick=()=>moveMatch(-1);$('#nextProduct').onclick=()=>moveMatch(1);$('#startVisit').onclick=()=>beginEditor();$('#dealerRecords').onclick=()=>openRecords('all',selectedDealer.id);$('#toReview').onclick=review;$('#submitVisit').onclick=submit;$('#viewSubmitted').onclick=()=>openVisit(lastSubmittedId);$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login/'+me.type.toLowerCase()};$('#myButton').onclick=()=>toast(me.name+'｜Passkey 已登入');$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$$('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));$$('[data-record-filter]').forEach(b=>b.onclick=()=>openRecords(b.dataset.recordFilter));setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),1000);init();
</script></body></html>
