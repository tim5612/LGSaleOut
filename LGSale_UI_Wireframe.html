<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGSale｜手機巡店</title>
  <style>
    :root{--blue:#1769aa;--nav:#17324d;--bg:#eef2f6;--ink:#172b3a;--muted:#667085;--line:#d9e1e8;--ok:#087a55;--warn:#b54708}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(100%,430px);min-height:100vh;margin:auto;background:#f8fafc;box-shadow:0 0 40px #1b355233;position:relative;padding-bottom:78px}.statusbar{height:26px;background:var(--nav);color:#dce8f1;font-size:11px;padding:6px 16px;display:flex;justify-content:space-between}.head{height:58px;background:var(--nav);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.head b{font-size:18px}.head button{border:0;background:#ffffff18;color:white;border-radius:7px;padding:7px 9px}.content{padding:18px}.hero{background:linear-gradient(135deg,#17324d,#1769aa);color:white;padding:22px;border-radius:14px;margin-bottom:16px}.hero h1{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:#d9eaf7}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.card h2{font-size:16px;margin:0 0 10px}.metric{display:flex;align-items:end;justify-content:space-between}.metric strong{font-size:32px;color:var(--blue)}.list{display:grid;gap:9px}.item{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:14px;text-align:left;color:var(--ink);display:flex;justify-content:space-between;align-items:center}.item small{display:block;color:var(--muted);margin-top:3px}.pill{background:#e8f2fb;color:var(--blue);font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}.search,.input{width:100%;border:1px solid #aebdca;border-radius:9px;background:white;padding:12px}.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:14px}.btn{width:100%;border:1px solid var(--blue);background:white;color:var(--blue);font-weight:700;border-radius:10px;padding:13px}.btn.primary{background:var(--blue);color:white}.btn.warn{border-color:#e2a321;color:#965a00;background:#fff9eb}.product{background:white;border:1px solid var(--line);border-radius:11px;padding:13px;margin:10px 0}.product-head{display:flex;justify-content:space-between;margin-bottom:10px}.product-head small{color:var(--muted)}.qty{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.qty label{font-size:11px;color:var(--muted)}.qty input{width:100%;margin-top:4px;padding:9px 6px;border:1px solid var(--line);border-radius:7px;text-align:center}.review-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.review-row:first-child{border:0}.success{text-align:center;padding:60px 24px}.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#e8f8ef;color:var(--ok);font-size:36px;margin:0 auto 20px}.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;border-top:1px solid var(--line);background:white;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:white;color:var(--muted);font-size:11px}.bottom button.active{color:var(--blue);font-weight:700}.bottom b{display:block;font-size:20px}.notice{background:#fff8e8;border:1px solid #f3d58b;color:#694a00;padding:12px;border-radius:9px;font-size:13px}.toplink{color:#d8ecfa;text-decoration:none;font-size:12px}[hidden]{display:none!important}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#172b3a;color:white;padding:10px 15px;border-radius:8px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
<div class="shell">
  <div class="statusbar"><span>9:41</span><span>●●●　100%</span></div>
  <header class="head"><b>LGSale　我的工作台</b><a class="toplink" href="/">桌機管理</a></header>
  <main class="content">
    <section id="home">
      <div class="hero"><h1>王小明，早安</h1><p>今天有 3 家建議巡店</p></div>
      <div class="card metric"><div><h2>今日建議巡店</h2><span>依上次巡店時間排序</span></div><strong>3</strong></div>
      <div class="list" id="suggested"></div>
      <div class="card"><h2>最近巡店紀錄</h2><button class="item"><span>可修改的業務回報<small>仍在 72 小時修改期限內</small></span><b>2 ›</b></button><button class="item"><span>經銷商自行回報<small>業務帳號不可修改</small></span><b>1 ›</b></button><button class="item"><span>已鎖定紀錄<small>超過 72 小時，僅能查看</small></span><b>3 ›</b></button></div>
    </section>
    <section id="dealers" hidden><button class="back" data-go="home">‹ 我的工作台</button><h1>選擇經銷商</h1><input class="search" id="dealerSearch" placeholder="🔍 搜尋代碼或經銷商名稱"><div class="list" id="dealerList" style="margin-top:14px"></div></section>
    <section id="summary" hidden><button class="back" data-go="dealers">‹ 選擇經銷商</button><div class="hero"><h1 id="dealerName">台北大同電器</h1><p id="dealerMeta">A 級｜TW002351001H</p></div><div class="card"><h2>最近巡店</h2><p><b>2026/07/22 14:20</b><br><span style="color:var(--muted)">資料狀態：需更新</span></p></div><div class="card"><h2>上次回報摘要</h2><p>已填商品 8 項｜實銷 23｜陳列 17</p></div><button class="btn primary" id="startVisit">開始本次巡店</button><p><button class="btn">查看巡店紀錄／可修改資料</button></p></section>
    <section id="visit" hidden><button class="back" data-go="summary">‹ 返回經銷商摘要</button><h1 id="visitTitle">本次巡店</h1><input class="search" id="productSearch" placeholder="🔍 搜尋型號或商品名稱"><div id="products"></div><button class="btn primary" id="toReview">下一步：確認送出</button></section>
    <section id="review" hidden><button class="back" data-go="visit">‹ 返回修改</button><h1>送出前確認</h1><div class="notice">確認送出後才會正式建立巡店紀錄，並由伺服器寫入回報時間；一般使用者可修改 72 小時。</div><div class="card"><h2 id="reviewDealer">台北大同電器</h2><div id="reviewRows"></div></div><button class="btn primary" id="submitVisit">確認並送出</button></section>
    <section id="success" hidden><div class="success"><div class="check">✓</div><h1>巡店回報已送出</h1><p id="successText">已建立巡店紀錄</p><button class="btn primary" data-go="home">返回工作台</button></div></section>
  </main>
  <nav class="bottom"><button class="active" data-go="home"><b>⌂</b>首頁</button><button data-go="dealers"><b>▣</b>經銷商</button><button onclick="location.href='/photo'"><b>✓</b>任務</button><button><b>●</b>我的</button></nav>
</div>
<div class="toast" id="toast"></div>
<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let dealers=[],products=[],selectedDealer=null;
  const toast=t=>{const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2200)};
  function show(id){$$('main section').forEach(x=>x.hidden=x.id!==id);$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$$('.bottom button[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id))}
  function dealerRow(d){return '<button class="item" data-id="'+d.id+'"><span><b>'+d.name+'</b><small>'+d.code+'｜'+d.level+' 級｜負責業務：'+d.employee+'</small></span><b>›</b></button>'}
  function renderDealers(list=dealers){$('#dealerList').innerHTML=list.map(dealerRow).join('');$$('#dealerList .item').forEach(b=>b.onclick=()=>openDealer(Number(b.dataset.id)))}
  function openDealer(id){selectedDealer=dealers.find(d=>d.id===id);$('#dealerName').textContent=selectedDealer.name;$('#dealerMeta').textContent=selectedDealer.level+' 級｜'+selectedDealer.code+'｜負責業務：'+selectedDealer.employee;$('#visitTitle').textContent=selectedDealer.name+'｜本次巡店';show('summary')}
  function renderProducts(list=products){$('#products').innerHTML=list.map(p=>'<div class="product" data-id="'+p.id+'"><div class="product-head"><span><b>'+p.code+'</b><small>　'+p.name+'</small></span><span class="pill">'+p.category+'</span></div><div class="qty"><label>實銷 1–10<input type="number" class="sell" min="1" max="10" placeholder="＋"></label><label>陳列 1<input type="number" class="display" min="1" max="1" placeholder="＋"></label><label>實銷日期<input type="date" class="soldate" value="2026-08-09"></label></div></div>').join('')}
  $('#dealerSearch').oninput=e=>renderDealers(dealers.filter(d=>(d.name+d.code).toLowerCase().includes(e.target.value.toLowerCase())));
  $('#productSearch').oninput=e=>renderProducts(products.filter(p=>(p.name+p.code).toLowerCase().includes(e.target.value.toLowerCase())));
  $('#startVisit').onclick=()=>show('visit');
  $('#toReview').onclick=()=>{const details=$$('#products .product').map(x=>({productId:Number(x.dataset.id),code:x.querySelector('b').textContent,sellOutQuantity:x.querySelector('.sell').value||null,displayQuantity:x.querySelector('.display').value||null,sellOutDate:x.querySelector('.sell').value?x.querySelector('.soldate').value:null})).filter(x=>x.sellOutQuantity||x.displayQuantity);if(!details.length)return toast('請至少填寫一項商品');window.visitDetails=details;$('#reviewDealer').textContent=selectedDealer.name;$('#reviewRows').innerHTML=details.map(x=>'<div class="review-row"><b>'+x.code+'</b><span>實銷 '+(x.sellOutQuantity||'—')+'｜陳列 '+(x.displayQuantity||'—')+'</span></div>').join('');show('review')};
  $('#submitVisit').onclick=async()=>{const r=await fetch('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dealerId:selectedDealer.id,entrySourceType:'EMPLOYEE',details:window.visitDetails})});const out=await r.json();if(!r.ok)return toast(out.error);$('#successText').textContent='巡店編號 SV-'+String(out.storeVisitId).padStart(4,'0')+'｜'+out.reportDateTime.replace('T',' ');show('success')};
  Promise.all([fetch('/api/dealers').then(r=>r.json()),fetch('/api/products').then(r=>r.json())]).then(([d,p])=>{dealers=d;products=p;renderDealers();renderProducts();$('#suggested').innerHTML=d.slice(0,2).map(dealerRow).join('');$$('#suggested .item').forEach(b=>b.onclick=()=>openDealer(Number(b.dataset.id)))});
  $$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
</script>
</body>
</html>
