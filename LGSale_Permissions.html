<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGSale｜Designer 權限設定</title>
  <style>
    :root{font:15px/1.5 "Segoe UI","Noto Sans TC",sans-serif;color:#203448;background:#f4f7fa}
    *{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
    aside{background:#19334d;color:#fff;padding:24px 12px}aside h1{font-size:22px;margin:0 12px 4px}aside p{color:#b9d1e1;font-size:12px;margin:0 12px 28px}
    aside a{display:block;color:#dceaf3;text-decoration:none;padding:12px 15px;border-radius:8px}aside a.active,aside a:hover{background:#2b5473;color:white}
    main{padding:32px 40px;max-width:1450px;width:100%}header{display:flex;justify-content:space-between;align-items:start;gap:20px}h2{font-size:27px;margin:0}h3{margin:0 0 12px}.muted{color:#64778a}.notice{padding:14px 18px;background:#eaf3f9;border:1px solid #d5e0e9;border-radius:9px;margin:20px 0}
    .panel{background:#fff;border:1px solid #d5e0e9;border-radius:10px;margin:18px 0;padding:22px}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:6px;font-weight:650}
    select,input,button{font:inherit}select,input{border:1px solid #c9d6e1;border-radius:7px;padding:9px 12px;background:white;min-width:215px}button{border:1px solid #c9d6e1;border-radius:7px;background:#fff;padding:8px 13px;cursor:pointer}button.primary{background:#1769aa;color:white;border-color:#1769aa}button:disabled{opacity:.5;cursor:not-allowed}
    table{border-collapse:collapse;width:100%;min-width:760px}th,td{border-bottom:1px solid #e4ebf1;padding:10px 12px;text-align:left}th{background:#eff4f8;color:#52677a;font-size:12px}td select{min-width:155px}.scroll{overflow:auto}.tag{display:inline-block;background:#eaf3f9;color:#1769aa;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
    .menu-preview{display:flex;flex-wrap:wrap;gap:8px}.menu-preview span{background:#19334d;color:white;padding:7px 12px;border-radius:7px}.error{color:#b42318}.success{color:#087a55}.audit{font-size:13px}.audit div{padding:7px 0;border-bottom:1px solid #edf1f4}
    @media(max-width:760px){.app{display:block}aside{padding:14px}main{padding:20px}header{display:block}}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="brand">LGSale<small>Designer 專屬設定</small></div><nav><a class="active" href="/permissions">權限與 Menu</a></nav></aside>
<main><header><div><h2>權限與 Menu 設定</h2><div class="muted">先設定職級預設，再對個別帳號設定允許或禁止。</div></div><div id="who" class="tag">讀取中…</div></header>
<div class="notice">只有 Designer 能修改此頁。「管理」可維護營運資料，但不能修改權限。每次變更立即生效，並留下異動紀錄。</div>
<div class="panel controls"><label>設定對象<select id="kind"><option value="ROLE">職級預設</option><option value="ACCOUNT">個別帳號</option></select></label><label id="roleLabel">職級<select id="role"></select></label><label id="accountLabel" hidden>帳號<select id="account"></select></label><button id="reload">重新整理</button></div>
<div class="panel"><h3 id="heading">功能權限</h3><p class="muted">「沿用預設」會移除個別設定；職級選擇沿用時，使用系統原始預設。</p><div class="scroll"><table><thead><tr><th>功能</th><th>職級原始預設</th><th>目前有效設定</th><th>此處設定</th><th>儲存</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="panel"><h3>目前可見的 Menu</h3><div class="menu-preview" id="preview"></div></div>
<div class="panel"><h3>最近權限異動</h3><div class="audit" id="audit"></div></div>
<div id="message" role="status"></div></main></div>
<script src="/assets/menu.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let config;
const menu=[['巡店任務','tasks.view'],['實銷與陳列','reports.view'],['PSI 月報','psi.view'],['員工與處所','employees.view'],['經銷商','dealers.view'],['人員與經銷商異動','assignments.view'],['期初庫存匯入','opening.manage'],['SaleIn 匯入','sellin.manage'],['Passkey 帳號','passkeys.manage']];
function effective(role,account){const base=new Set(config.roles[role].defaults),apply=rules=>Object.entries(rules||{}).forEach(([key,val])=>val?base.add(key):base.delete(key));apply(config.roles[role].overrides);if(account)apply(account.overrides);for(const [child,parent] of Object.entries({'tasks.create':'tasks.view','tasks.toggle':'tasks.view','tasks.photos.manage':'tasks.view','psi.export':'psi.view','mobile.tasks.execute':'mobile.tasks.view','reports.create':'mobile.reports.view','reports.edit':'mobile.reports.view','employees.manage':'employees.view','dealers.manage':'dealers.view','assignments.manage':'assignments.view'})){if(!base.has(parent))base.delete(child)}return base}
function render(){if(!config)return;const personal=$('#kind').value==='ACCOUNT',account=config.accounts.find(x=>String(x.id)===$('#account').value),role=personal?(account?.role||'SALES'):$('#role').value,roleData=config.roles[role];if(!roleData)return;$('#roleLabel').hidden=personal;$('#accountLabel').hidden=!personal;$('#heading').textContent=personal?'個別帳號：'+(account?.name||''):'職級預設：'+roleData.name;const values=personal?(account?.overrides||{}):roleData.overrides,active=effective(role,personal?account:null),defaults=new Set(roleData.defaults);$('#rows').innerHTML=Object.entries(config.capabilities).map(([key,label])=>{const value=Object.hasOwn(values,key)?String(values[key]):'inherit';return '<tr><td>'+esc(label)+'<br><small class="muted">'+esc(key)+'</small></td><td>'+(defaults.has(key)?'允許':'禁止')+'</td><td><span class="tag">'+(active.has(key)?'允許':'禁止')+'</span></td><td><select data-key="'+esc(key)+'"><option value="inherit" '+(value==='inherit'?'selected':'')+'>沿用預設</option><option value="true" '+(value==='true'?'selected':'')+'>允許</option><option value="false" '+(value==='false'?'selected':'')+'>禁止</option></select></td><td><button class="primary" data-save="'+esc(key)+'">儲存</button></td></tr>'}).join('');$('#preview').innerHTML=menu.filter(([,key])=>active.has(key)).map(([label])=>'<span>'+esc(label)+'</span>').join('')||'<span>沒有可用的營運 Menu</span>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save,role,account));}
async function save(key,role,account){const select=document.querySelector('[data-key="'+key+'"]'),raw=select.value,personal=$('#kind').value==='ACCOUNT';if(personal&&!account)return;const value=raw==='inherit'?null:raw==='true';const r=await fetch('/api/permissions',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjectType:personal?'ACCOUNT':'ROLE',subject:personal?String(account.id):role,capability:key,value})});const out=await r.json();$('#message').textContent=r.ok?'已儲存：'+config.capabilities[key]:out.error||'儲存失敗';$('#message').className=r.ok?'success':'error';if(r.ok)await load()}
async function load(){const r=await fetch('/api/permissions',{cache:'no-store'}),out=await r.json();if(!r.ok){$('#message').className='error';$('#message').textContent=out.error||'讀取失敗';return}config=out;const role=$('#role').value,account=$('#account').value;$('#role').innerHTML=Object.entries(out.roles).map(([key,val])=>'<option value="'+key+'">'+esc(val.name)+'</option>').join('');$('#account').innerHTML=out.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.ref+' '+a.name+'（'+(out.roles[a.role]?.name||a.role)+'）')+'</option>').join('');if(role&&out.roles[role])$('#role').value=role;if(account&&out.accounts.some(a=>String(a.id)===account))$('#account').value=account;$('#audit').innerHTML=out.audit.map(a=>'<div>'+esc(a.at+'　'+a.actor+'　'+a.subjectType+' '+a.subjectId+'　'+a.capability+'：'+String(a.oldValue)+' → '+String(a.newValue))+'</div>').join('')||'<div>尚無異動紀錄</div>';render()}
$('#kind').onchange=render;$('#role').onchange=render;$('#account').onchange=render;$('#reload').onclick=load;fetch('/api/auth/me').then(r=>r.json()).then(me=>{$('#who').textContent=me.name+'｜Designer'});load();
</script></body></html>
