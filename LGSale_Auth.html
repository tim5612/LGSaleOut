<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGSale Passkey</title>
  <style>
    :root{--blue:#1769aa;--ink:#172b3a;--muted:#667085;--line:#d9e1e8;--bg:#f5f7fa;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI","Noto Sans TC",sans-serif}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 50px #17324d17}.brand{font-size:25px;font-weight:750;color:#17324d}.badge{display:inline-block;margin-top:18px;padding:5px 10px;border-radius:999px;background:#eaf4fb;color:var(--blue);font-size:12px;font-weight:700}h1{font-size:27px;margin:13px 0 5px}p{color:var(--muted)}label{display:block;font-weight:650;margin:22px 0 7px}.input{width:100%;padding:12px;border:1px solid #98a2b3;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);margin-top:10px}.btn:disabled{opacity:.5;cursor:wait}.notice{margin-top:18px;padding:12px 14px;border-radius:9px;background:#f2f4f7;color:#475467;font-size:13px}.error{background:#feeceb;color:var(--danger)}.ok{background:#e8f7f0;color:#087a55}.small{text-align:center;font-size:12px;margin-top:22px}.account-context{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#f7fafc}.account-context b{display:block;font-size:16px;margin-bottom:7px}.account-context ul{margin:8px 0 0;padding-left:21px;color:var(--muted);font-size:13px}.qr-panel{text-align:center}.qr-panel img{display:block;width:250px;height:250px;margin:18px auto 10px;border:1px solid var(--line);padding:8px}.qr-panel b{font-size:18px}.qr-panel[hidden],[hidden]{display:none!important}
  </style>
</head>
<body><main class="card">
  <div class="brand">LGSale</div><div class="badge" id="badge">PASSKEY</div>
  <h1 id="title">安全登入</h1><p id="subtitle">使用 Face ID、Touch ID、Windows Hello 或裝置解鎖來核准。</p><div class="account-context" id="accountContext" hidden></div>
  <div id="registerFields" hidden><label for="deviceName">這把 Passkey 的名稱</label><input class="input" id="deviceName" maxlength="100" placeholder="例如：王小明的 iPhone"></div>
  <div id="loginActions"><button class="btn" id="action">使用 Passkey 登入</button><button class="btn secondary" id="secondaryAction" hidden></button><button class="btn secondary" id="qrAction" hidden>使用 iPhone 掃碼授權桌機</button></div>
  <div class="qr-panel" id="qrPanel" hidden><img id="qrImage" alt="桌機登入授權 QR Code"><b>請用 iPhone 相機掃描</b><p>手機將使用 Passkey／Face ID 確認授權。<br>QR Code 剩餘 <span id="qrCountdown">120</span> 秒</p><button class="btn secondary" id="cancelQr">取消掃碼登入</button></div>
  <div class="notice" id="notice">本系統不會取得或保存你的臉部、指紋與裝置密碼。</div>
  <p class="small">不提供帳號密碼登入</p>
</main><script>
const qs=new URLSearchParams(location.search), isRegister=location.pathname==='/register', type=(location.pathname.split('/').pop()||'employee').toUpperCase();
const $=s=>document.querySelector(s), action=$('#action'),secondaryAction=$('#secondaryAction'),notice=$('#notice'),qrAction=$('#qrAction');let qrTimer=null,qrToken=null;
function bytes(value){const s=value.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))}
function b64(value){let s='';new Uint8Array(value).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function serialize(c){return{id:c.id,type:c.type,rawId:b64(c.rawId),authenticatorAttachment:c.authenticatorAttachment,response:{clientDataJSON:b64(c.response.clientDataJSON),attestationObject:c.response.attestationObject?b64(c.response.attestationObject):undefined,authenticatorData:c.response.authenticatorData?b64(c.response.authenticatorData):undefined,signature:c.response.signature?b64(c.response.signature):undefined,userHandle:c.response.userHandle?b64(c.response.userHandle):null,transports:c.response.getTransports?c.response.getTransports():undefined},clientExtensionResults:c.getClientExtensionResults()}}
function escHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}),j=await r.json();if(!r.ok)throw Error(j.error||'操作失敗');return j}
function fail(e){notice.textContent=e.name==='NotAllowedError'?'已取消或逾時，請再試一次。':e.message;notice.className='notice error';action.disabled=false}
function desktopLabel(){const platform=navigator.userAgentData?.platform||navigator.platform||'Windows 桌機';return 'LGSale 桌機版｜'+platform}
function resetQr(message){clearInterval(qrTimer);qrTimer=null;qrToken=null;$('#qrPanel').hidden=true;$('#loginActions').hidden=false;if(message){notice.textContent=message;notice.className='notice error'}}
async function startQr(){try{const next=qs.get('next')||'/';const out=await api('/api/auth/desktop-approval/start',{deviceName:desktopLabel(),next});qrToken=out.token;$('#qrImage').src='/api/auth/desktop-approval/qr/'+encodeURIComponent(qrToken)+'.png';$('#loginActions').hidden=true;$('#qrPanel').hidden=false;notice.textContent='等待手機確認授權…';notice.className='notice';const expires=Date.parse(out.expiresAt);const poll=async()=>{const seconds=Math.max(0,Math.ceil((expires-Date.now())/1000));$('#qrCountdown').textContent=seconds;if(seconds<=0)return resetQr('QR Code 已失效，請重新產生。');try{const r=await fetch('/api/auth/desktop-approval/status?token='+encodeURIComponent(qrToken)),j=await r.json();if(!r.ok)throw Error(j.error||'無法查詢授權狀態');if(j.status==='APPROVED'){clearInterval(qrTimer);notice.textContent='手機授權成功，正在進入系統…';notice.className='notice ok';location.href=j.next||'/'}else if(j.status==='EXPIRED')resetQr('QR Code 已失效，請重新產生。')}catch(e){resetQr(e.message)}};await poll();if(qrToken)qrTimer=setInterval(poll,1500)}catch(e){resetQr(e.message)}}
if(!window.PublicKeyCredential){action.disabled=true;notice.textContent='此瀏覽器不支援 Passkey，請改用最新版 Safari、Chrome 或 Edge。';notice.className='notice error'}
async function copyLoginUrl(accountType){const url=new URL('/login/'+accountType.toLowerCase(),location.origin).href;try{await navigator.clipboard.writeText(url);notice.textContent='固定登入網址已複製，可以傳到電腦或加入書籤。';notice.className='notice ok'}catch{prompt('請複製固定登入網址',url)}}
function registrationMessage(state){const messages={USED:['這個設定連結已使用','如果已完成 Passkey 設定，請直接前往登入；若要新增裝置，請聯絡管理人員重新產生邀請。'],EXPIRED:['設定連結已逾時','這個連結已超過 15 分鐘，請管理人員重新產生邀請。'],REVOKED:['設定連結已被取代或撤銷','管理人員可能已產生新的設定連結，請使用最新邀請。'],DISABLED:['帳號目前無法使用','此帳號已停用，不能設定或登入，請聯絡管理人員。'],INVALID:['設定連結不正確','無法辨識這個 Passkey 設定連結，請聯絡管理人員。']};return messages[state.status]||messages.INVALID}
function showRegistrationEnd(state){const message=registrationMessage(state);$('#title').textContent=message[0];$('#subtitle').textContent=message[1];$('#registerFields').hidden=true;$('#accountContext').hidden=true;notice.textContent=state.status==='USED'?'一次性設定連結已完成任務，不需要再保存。':'系統不會使用失效連結建立 Passkey。';notice.className='notice '+(state.status==='USED'?'ok':'error');if(state.accountType&&state.status!=='DISABLED'){action.hidden=false;action.disabled=false;action.textContent='前往'+(state.accountType==='EMPLOYEE'?'員工':'經銷商')+'登入';action.onclick=()=>location.href='/login/'+state.accountType.toLowerCase();secondaryAction.hidden=false;secondaryAction.textContent='複製固定登入網址';secondaryAction.onclick=()=>copyLoginUrl(state.accountType)}else{action.hidden=true;secondaryAction.hidden=true}}
function showRegistrationSuccess(account){$('#title').textContent='Passkey 已設定完成';$('#subtitle').textContent=account.label+'，之後請從固定的 '+(account.type==='EMPLOYEE'?'員工':'經銷商')+' Passkey 登入頁進入系統。';$('#registerFields').hidden=true;$('#accountContext').innerHTML='<b>設定完成</b>這個一次性註冊連結已完成任務，不需要保存。'+(account.type==='EMPLOYEE'?'<ul><li>手機：依權限執行任務與巡店</li><li>電腦：查看自己的 PSI 與其他授權功能</li></ul>':'');$('#accountContext').hidden=false;notice.textContent='請保存固定登入網址，不要保存這個一次性設定連結。';notice.className='notice ok';action.textContent='立即登入';action.disabled=false;action.onclick=()=>location.href='/login/'+account.type.toLowerCase();secondaryAction.hidden=false;secondaryAction.textContent='複製／分享固定登入網址';secondaryAction.onclick=()=>copyLoginUrl(account.type)}
async function initRegistration(){action.disabled=true;$('#title').textContent='正在檢查設定連結…';$('#subtitle').textContent='請稍候。';try{const r=await fetch('/api/auth/register/status?token='+encodeURIComponent(qs.get('token')||'')),state=await r.json();if(state.status!=='VALID')return showRegistrationEnd(state);const label=state.accountType==='EMPLOYEE'?'業務帳號':'經銷商帳號';$('#badge').textContent=label;$('#title').textContent='設定 Passkey';$('#subtitle').textContent='建立時，裝置會要求使用 Face ID、指紋或裝置密碼確認。';$('#accountContext').innerHTML='<b>'+escHtml(state.displayName)+'｜'+label+'</b><span>'+escHtml(state.ownerRef)+'</span><ul><li>請在日後要登入的裝置上操作</li><li>本連結只能使用一次</li><li>完成後請改用固定登入網址</li></ul>';$('#accountContext').hidden=false;$('#registerFields').hidden=false;action.textContent='建立 Passkey';action.disabled=false;action.onclick=async()=>{try{action.disabled=true;const o=await api('/api/auth/register/options',{token:qs.get('token')});o.challenge=bytes(o.challenge);o.user.id=bytes(o.user.id);(o.excludeCredentials||[]).forEach(x=>x.id=bytes(x.id));const c=await navigator.credentials.create({publicKey:o});await api('/api/auth/register/verify',{credential:serialize(c),deviceName:$('#deviceName').value});showRegistrationSuccess(o.account)}catch(e){fail(e)}}}catch(e){showRegistrationEnd({status:'INVALID'})}}
if(isRegister){initRegistration()
}else{const label=type==='DEALER'?'經銷商':'員工',isMobile=/iPhone|iPad|Android/i.test(navigator.userAgent);$('#badge').textContent=label+'端';$('#title').textContent=label+' Passkey 登入';if(type==='EMPLOYEE'&&!isMobile)qrAction.hidden=false;qrAction.onclick=startQr;$('#cancelQr').onclick=()=>resetQr();action.onclick=async()=>{try{action.disabled=true;const o=await api('/api/auth/login/options',{accountType:type});o.challenge=bytes(o.challenge);(o.allowCredentials||[]).forEach(x=>x.id=bytes(x.id));const c=await navigator.credentials.get({publicKey:o});await api('/api/auth/login/verify',{credential:serialize(c)});const me=await fetch('/api/auth/me').then(r=>r.json());const next=new URLSearchParams(location.search).get('next'),caps=me.capabilities||[];const destination=type==='DEALER'?(isMobile?'/dealer':'/psi'):isMobile?((caps.includes('mobile.reports.view')||caps.includes('mobile.tasks.view'))?'/mobile':'/mobile-locked'):caps.includes('tasks.view')?'/':me.designer?'/permissions':'/psi';location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:destination}catch(e){fail(e)}}}
  </script></body></html>
